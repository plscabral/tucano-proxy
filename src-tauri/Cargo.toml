[package]
name = "tucano"
version = "0.1.12"
description = "Tucano — open source HTTP/HTTPS debugging proxy"
authors = ["Paulo Cabral"]
license = "MIT"
repository = "https://github.com/plscabral/tucano-proxy"
edition = "2021"

[lib]
name = "tucano_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "tucano-proxy"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
hudsucker = "0.22"
hyper = "1"
hyper-rustls = { version = "0.26", default-features = false, features = ["http1", "ring", "tls12", "webpki-tokio"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
rcgen = { version = "0.13", features = ["pem"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
flate2 = "1"
brotli = "7"
zstd = "0.13"
once_cell = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
parking_lot = "0.12"
ctrlc = "3"
axum = "0.7"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
