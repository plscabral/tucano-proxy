[package]
name = "tucano-core"
version = "0.2.10"
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
hudsucker = "0.22"
hyper = "1"
hyper-rustls = { version = "0.26", default-features = false, features = ["http1", "ring", "tls12", "webpki-tokio"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
flate2 = "1"
brotli = "7"
zstd = "0.13"
once_cell = "1"
regex = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
parking_lot = "0.12"
axum = "0.7"
toml_edit = "0.22"

http-body = "1"
webpki-roots = "0.26"
url = "2"
fs2 = "0.4"
sha1 = "0.10"

tempfile = "3"
moka = { version = "0.12", features = ["future"] }
time = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }
tower-service = "0.3"

x509-parser = "0.16"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Networking_WinInet"] }
