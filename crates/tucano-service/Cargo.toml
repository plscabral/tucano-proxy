[package]
name = "tucano-service"
version = "0.2.8"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = "0.7"
fs2 = "0.4"
libc = "0.2"
mime_guess = "2"
parking_lot = "0.12"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled", "hooks", "limits"] }
rust-embed = { version = "8", features = ["debug-embed"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tucano-core = { path = "../tucano-core" }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
